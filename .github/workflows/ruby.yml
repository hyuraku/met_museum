# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Ruby

on: [push, pull_request]

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ '3.3', '3.4', '4.0' ]
    name: Ruby ${{ matrix.ruby }} spec
    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
    # To automatically get bug fixes and new Ruby versions for ruby/setup-ruby,
    # change this to (see https://github.com/ruby/setup-ruby#versioning):
      uses: ruby/setup-ruby@v1
      # uses: ruby/setup-ruby@ec106b438a1ff6ff109590de34ddc62c540232e0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Install dependencies
      run: bundle install
    - name: Run spec
      run: bundle exec rake

  # Dependabot の PR を、上の CI ジョブがすべて通ったあとに条件付きでマージする。
  # needs で CI の成功を前提にしているので、ブランチ保護（無料プランの private repo では使えない）に頼らない。
  # 自動マージする条件:
  #   - patch: version update / security update のどちらも
  #   - minor: version update のグループ（minor-and-patch）だけ
  # major と、minor を含む security update は人がレビューする。
  dependabot-auto-merge:
    name: Dependabot auto-merge
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Squash-merge eligible updates
        id: merge
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (steps.metadata.outputs.dependency-group == 'minor-and-patch' &&
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
